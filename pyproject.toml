[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pagewatcher"
version = "0.1.0"
description = "Monitor web pages for material changes and send push notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx[http2]>=0.27,<1",
    "PyJWT[crypto]>=2.8,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
pagewatcher = "pagewatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pagewatcher"]

[tool.coverage.report]
show_missing = true
skip_covered = true
